name: iOS build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  simulator-build:
    name: Build for iOS Simulator
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: List project
        run: xcodebuild -list -project TivanONTiOS.xcodeproj

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project TivanONTiOS.xcodeproj \
            -scheme TivanONTiOS \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package simulator app
        if: success()
        run: |
          APP_PATH="$(find build/DerivedData/Build/Products/Debug-iphonesimulator -name 'TivanONTiOS.app' -maxdepth 2 -print -quit)"
          test -n "$APP_PATH"
          mkdir -p build/artifacts
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" build/artifacts/TivanONTiOS-simulator-app.zip

      - name: Upload simulator artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TivanONTiOS-simulator-app
          path: build/artifacts/TivanONTiOS-simulator-app.zip

